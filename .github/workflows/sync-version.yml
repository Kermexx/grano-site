name: Sincroniza version.json com as releases mais recentes

# Roda sozinho toda vez que uma release é publicada nesse repositório
# (a mesma que recebe o .exe do PC e o .apk do mobile), e também pode ser
# disparado manualmente (aba Actions > este workflow > Run workflow) -
# útil se um asset for anexado DEPOIS da release já ter sido publicada,
# já que isso não dispara o evento "released" de novo sozinho.
#
# PC e mobile são publicados em momentos diferentes, cada um na sua
# versão - não saem sempre juntos na mesma tag (achado testando de
# verdade: uma release só de Windows não tinha .apk nenhum, e a versão
# anterior deste workflow exigia os dois assets NA MESMA release antes de
# atualizar qualquer coisa, o que travava o link do Windows numa versão
# velha esperando o mobile alcançar). Agora cada plataforma é resolvida
# separado: pega a release mais recente QUE TENHA aquele tipo de asset
# (.exe ou .apk), sem exigir que seja a mesma release nem que a outra
# plataforma também tenha saído.
#
# Usa o GITHUB_TOKEN automático do próprio Actions (autenticado, limite
# de 1000 requisições/hora) em vez da API pública sem autenticação (60/hora
# por IP, compartilhado - foi exatamente isso que travou o download do
# site pra usuários reais antes dessa automação existir).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Sem "ref" explícito, um gatilho por release faz o checkout ficar em
      # detached HEAD (no commit da TAG, não da branch) - e git push falha
      # com "You are not currently on a branch" (achado testando de
      # verdade, não é teórico).
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Busca a release mais recente de cada plataforma e monta version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Até 30 releases mais recentes já cobre qualquer cenário real de
          # atraso entre plataformas sem paginar a API à toa.
          RELEASES=$(gh api "repos/${{ github.repository }}/releases?per_page=30")

          WIN_RELEASE=$(echo "$RELEASES" | jq -r '[.[] | select(.draft == false) | select([.assets[] | select(.name | endswith(".exe"))] | length > 0)][0]')
          APK_RELEASE=$(echo "$RELEASES" | jq -r '[.[] | select(.draft == false) | select([.assets[] | select(.name | endswith(".apk"))] | length > 0)][0]')

          CURRENT=$(cat version.json 2>/dev/null || echo '{}')

          if [ "$WIN_RELEASE" != "null" ]; then
            WIN_VERSION=$(echo "$WIN_RELEASE" | jq -r '.tag_name | sub("^v"; "")')
            WIN_URL=$(echo "$WIN_RELEASE" | jq -r '[.assets[] | select(.name | endswith(".exe"))][0].browser_download_url')
          else
            WIN_VERSION=$(echo "$CURRENT" | jq -r '.windowsVersion // null')
            WIN_URL=$(echo "$CURRENT" | jq -r '.windowsUrl // null')
          fi

          if [ "$APK_RELEASE" != "null" ]; then
            APK_VERSION=$(echo "$APK_RELEASE" | jq -r '.tag_name | sub("^v"; "")')
            APK_URL=$(echo "$APK_RELEASE" | jq -r '[.assets[] | select(.name | endswith(".apk"))][0].browser_download_url')
          else
            APK_VERSION=$(echo "$CURRENT" | jq -r '.androidVersion // null')
            APK_URL=$(echo "$CURRENT" | jq -r '.androidUrl // null')
          fi

          jq -n \
            --arg winVer "$WIN_VERSION" --arg winUrl "$WIN_URL" \
            --arg apkVer "$APK_VERSION" --arg apkUrl "$APK_URL" \
            '{windowsVersion: $winVer, androidVersion: $apkVer, windowsUrl: $winUrl, androidUrl: $apkUrl}' > version.json

          echo "version.json gerado:"
          cat version.json

      - name: Commita e sobe se mudou algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- version.json; then
            echo "Nada mudou, não precisa commitar."
          else
            git add version.json
            git commit -m "Atualiza version.json automaticamente"
            git push origin HEAD:master
          fi
